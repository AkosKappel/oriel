# Local development stack: the database and the sync service. Production hosting is decided
# later (backlog D-05).
services:
  db:
    image: postgres:18
    container_name: oriel-db
    restart: unless-stopped
    # Logical replication is what PowerSync reads changes from (phase 7).
    command: ["postgres", "-c", "wal_level=logical"]
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: oriel
      POSTGRES_USER: oriel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oriel -d oriel"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Sync service: streams each user's spaces to their devices (powersync/ holds its config).
  powersync:
    image: journeyapps/powersync-service:1.27.2
    container_name: oriel-powersync
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_SOURCE_URL: postgresql://powersync_role:${PS_ROLE_PASSWORD:?set PS_ROLE_PASSWORD in .env}@db:5432/oriel
      PS_STORAGE_URL: postgresql://powersync_storage:${PS_STORAGE_PASSWORD:?set PS_STORAGE_PASSWORD in .env}@db:5432/powersync_storage
      PS_JWT_KID: ${PS_JWT_KID:?run scripts/generate-sync-keys.mjs}
      PS_JWT_PUBLIC_X: ${PS_JWT_PUBLIC_X:?run scripts/generate-sync-keys.mjs}
    volumes:
      - ./powersync:/config:ro
    ports:
      - "127.0.0.1:${POWERSYNC_HOST_PORT:-8086}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 15

volumes:
  # PostgreSQL 18 data (postgres:18 mounts /var/lib/postgresql)
  dbdata:
