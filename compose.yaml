# Local development database. Production hosting is decided later (backlog D-05).
services:
  db:
    image: postgres:18
    container_name: oriel-db
    restart: unless-stopped
    # Logical replication is what PowerSync reads changes from (phase 7).
    command: ["postgres", "-c", "wal_level=logical"]
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: oriel
      POSTGRES_USER: oriel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oriel -d oriel"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # PostgreSQL 18 data (postgres:18 mounts /var/lib/postgresql)
  dbdata:
