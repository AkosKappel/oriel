name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: oriel
          POSTGRES_USER: oriel
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oriel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://oriel:ci-only@localhost:5432/oriel
      # Test-only values for a throwaway database, not real secrets.
      BETTER_AUTH_SECRET: ci-only-auth-secret-for-the-test-database
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  image:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/akoskappel/oriel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Build into the local Docker engine first, so the scan sees the exact image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: oriel:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on fixable high or critical vulnerabilities; scans never run on the home server.
      # Pinned to a commit: this action's tags were hijacked in a 2026 supply-chain attack.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oriel:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Pull requests only build and scan; main also pushes to GHCR (from the build cache).
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
