name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: oriel
          POSTGRES_USER: oriel
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oriel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://oriel:ci-only@localhost:5432/oriel
      # Test-only values for a throwaway database, not real secrets.
      BETTER_AUTH_SECRET: ci-only-auth-secret-for-the-test-database
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on known high or critical advisories in what the server runs; dev tools are left
      # to Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  # The production build against the real stack: PostgreSQL with logical replication and the
  # PowerSync Service, from compose.yaml (service containers cannot set wal_level). Desktop and
  # mobile Chrome, with axe. CI only; locally the suite runs with one worker.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Throwaway settings for this run: the example passwords, a fresh auth secret and new
      # sync keys. Nothing here is a real secret.
      - name: Configure the test stack
        run: |
          grep -vE '^(BETTER_AUTH_SECRET|SYNC_JWT_PRIVATE_KEY|PS_JWT_KID|PS_JWT_PUBLIC_X)=' .env.example > .env
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .env
          node scripts/generate-sync-keys.mjs >> .env
      - run: docker compose up -d --wait db
      - run: npm run db:migrate
      - run: ./scripts/setup-powersync-db.sh
      - run: docker compose up -d --wait powersync
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  # Desktop Lighthouse on home, sign-in and settings: accessibility, best practices and SEO 100,
  # a compressed JavaScript budget per route, and performance 90 (a warning on home, which loads
  # the local database; see backlog U-07). CI only, never on the server.
  lighthouse:
    runs-on: ubuntu-latest
    env:
      # Pages render without the database; the settings only have to be valid.
      DATABASE_URL: postgres://lighthouse:unused@localhost:5432/none
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-used-for-accounts
      PORT: 3200
      BETTER_AUTH_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The action keeps its reports in .lighthouseci/, which each run starts afresh: upload after each.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-desktop
          path: .lighthouseci/
          include-hidden-files: true
      # Lighthouse's default mobile emulation (slow 4G, 4x CPU), reported but not enforced yet.
      - if: ${{ !cancelled() }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.mobile.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile
          path: .lighthouseci/
          include-hidden-files: true

  image:
    needs: [check, e2e, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/akoskappel/oriel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Build into the local Docker engine first, so the scan sees the exact image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: oriel:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on fixable high or critical vulnerabilities; scans never run on the home server.
      # Pinned to a commit: this action's tags were hijacked in a 2026 supply-chain attack.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oriel:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Pull requests only build and scan; main also pushes to GHCR (from the build cache).
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
