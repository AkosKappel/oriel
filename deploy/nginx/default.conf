# nginx in front of the app and the PowerSync Service, like the other apps on the server: one
# access log in the `combined` format (tokens masked) for the traffic dashboard and CrowdSec, the maintenance
# page, and one origin for both, so the browser needs no CORS and no second hostname.

# The visitor's address comes from the Tailscale sidecar, which reaches nginx over a Docker
# network (all in 172.16.0.0/12); the access log shows it instead of the sidecar's.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# Invite links and password resets carry single-use tokens (in the path, or the query of
# /reset-password); the log keeps them out, also in the referer of the requests such a page makes.
# Otherwise the same as `combined`, so the dashboard and CrowdSec parse it unchanged.
map $request $loggable_request {
    "~^(?<method>\S+) (?<path>/invite/|/api/auth/reset-password/)[^ ]* (?<protocol>\S+)$" "$method $path:token $protocol";
    "~^(?<method>\S+) /reset-password\?[^ ]* (?<protocol>\S+)$" "$method /reset-password?:token $protocol";
    default $request;
}
map $http_referer $loggable_referer {
    "" "-";
    "~^(?<origin>https?://[^/]+)(?<path>/invite/|/reset-password)" "$origin$path:token";
    default $http_referer;
}
log_format masked '$remote_addr - $remote_user [$time_local] "$loggable_request" '
                  '$status $body_bytes_sent "$loggable_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log masked;
    # a copy on the host for the traffic dashboard and CrowdSec (ACCESS_LOG_DIR in .env)
    access_log /var/log/nginx/shared/access.log masked;
    error_log  /var/log/nginx/error.log;
    server_tokens off;

    # The app sets the security headers itself (a CSP with a nonce per response, HSTS). A sync
    # upload carries at most 1,000 operations, and a note at most 20,000 characters.
    client_max_body_size 8m;

    # Docker's DNS; re-resolve the containers so recreating one doesn't leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:3000;
    set $sync_upstream http://powersync:8080;
    absolute_redirect off;

    # Maintenance mode: `touch maintenance/on` in the deploy folder, remove the file to end
    # it. The same page covers a restarting app (502/504), e.g. during a deploy. The app's
    # own 503 (the health check with the database down) passes through unchanged. Open apps
    # keep working offline meanwhile and upload their changes afterwards.
    if (-f /usr/share/nginx/maintenance/on) {
        return 503;
    }
    error_page 502 503 504 =503 @maintenance;
    location @maintenance {
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
        # The file handler answers 405 to anything but GET and HEAD; requests the open app
        # sends (sync, server functions) get a short 503 instead, which they retry.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503 "Oriel is being updated. Your changes are kept on the device.\n";
        }
        root /usr/share/nginx/maintenance;
        rewrite ^ /index.html break;
    }

    # The PowerSync Service under /powersync/ (POWERSYNC_URL ends in /powersync). Sync is a
    # long-lived HTTP stream: no buffering, and a read timeout far above its keepalive lines.
    location /powersync/ {
        rewrite ^/powersync/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # For the WebSocket transport, should the client switch to it (backlog D-09).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass $sync_upstream;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Passed on unchanged: Better Auth's rate limits key on the visitor in it
        # (src/server/auth.ts), and the sidecar already replaces a client-supplied value.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $app_upstream;
    }
}
